<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030610">
<title>J.A.R.V.I.S. v2.0 — Slayer</title>
<style>
  :root{--bg:#030610;--panel:#0a1120;--line:#13304d;--cy:#2fd8ff;--cy2:#0aa8d6;--gold:#ffb340;--red:#ff4455;--ok:#39e07a;--txt:#d8f3ff;--mut:#5d8aa8}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:radial-gradient(900px 500px at 50% -10%,rgba(47,216,255,.12),transparent),var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
  header{text-align:center;padding:14px 10px 4px;position:relative}
  .reactor{width:70px;height:70px;margin:0 auto 6px;border-radius:50%;position:relative;
    background:radial-gradient(circle,#eafcff 0%,#9feaff 18%,#2fd8ff 38%,#07314d 70%,transparent 72%);
    box-shadow:0 0 30px rgba(47,216,255,.8);animation:breathe 3s ease-in-out infinite}
  .reactor::before,.reactor::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(47,216,255,.6)}
  .reactor::before{animation:spin 9s linear infinite}
  .reactor::after{inset:8px;border-style:solid;border-color:rgba(255,255,255,.35);animation:spin 5s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{0%,100%{box-shadow:0 0 24px rgba(47,216,255,.7)}50%{box-shadow:0 0 55px rgba(47,216,255,1)}}
  h1{font-size:1.3rem;letter-spacing:6px;color:var(--cy);text-shadow:0 0 18px rgba(47,216,255,.7)}
  .tagline{color:var(--mut);font-size:.72rem;letter-spacing:2px;margin-top:2px}
  #muteBtn{position:absolute;right:14px;top:14px;background:var(--panel);border:1px solid var(--line);color:var(--cy);
    width:42px;height:42px;border-radius:12px;font-size:1.1rem;cursor:pointer}
  .status{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:8px;font-size:.72rem;color:var(--mut);letter-spacing:1px}
  .status b{color:var(--ok)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:inline-block;animation:blink 2s infinite;margin-right:4px}
  @keyframes blink{50%{opacity:.4}}
  #chat{flex:1;overflow-y:auto;max-width:760px;width:100%;margin:0 auto;padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:86%;padding:11px 15px;border-radius:14px;font-size:.95rem;line-height:1.5;animation:pop .25s;word-wrap:break-word}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .me{align-self:flex-end;background:linear-gradient(135deg,#123a5c,#0d2a44);border:1px solid var(--line);border-bottom-right-radius:4px}
  .jv{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cy);border-bottom-left-radius:4px}
  .jv b.tag{color:var(--cy);font-size:.68rem;letter-spacing:2px;display:block;margin-bottom:4px}
  .jv.alerta{border-left-color:var(--red)}
  .jv.sucesso{border-left-color:var(--ok)}
  .jv.gold{border-left-color:var(--gold)}
  .jv a{color:var(--cy)}
  .bar{height:10px;background:#07233b;border-radius:6px;overflow:hidden;margin:8px 0 3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy2),var(--cy));width:0;transition:width .4s}
  .stat{font-size:.8rem;color:var(--mut)}
  .typing{display:inline-flex;gap:4px;padding:4px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--cy);animation:tp 1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
  @keyframes imgload{from{width:0}to{width:100%}}
  .inputbar{position:sticky;bottom:0;background:rgba(3,6,16,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 12px 12px}
  .inner{max-width:760px;margin:0 auto;display:flex;gap:8px}
  #txt{flex:1;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:1rem;outline:none}
  #txt:focus{border-color:var(--cy);box-shadow:0 0 14px rgba(47,216,255,.25)}
  .ib{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--cy);font-size:1.25rem;cursor:pointer;flex-shrink:0}
  .ib.send{background:linear-gradient(135deg,var(--cy2),var(--cy));color:#032}
  .ib.rec{background:var(--red);color:#fff;border-color:var(--red);animation:blink 1s infinite}
</style>
</head>
<body>

<header>
  <button id="muteBtn" onclick="toggleVoz()" title="Ativar/desativar voz">🔊</button>
  <div class="reactor"></div>
  <h1>J.A.R.V.I.S.</h1>
  <div class="tagline">v3.2 • CÉREBRO NEURAL • INTERFACE LIMPA</div>
</header>

<div class="status">
  <span><i class="dot"></i>ONLINE</span>
  <span>🕐 <b id="clock">--:--</b></span>
  <span>🔋 <b id="batt">--</b></span>
  <span>💰 <b id="saldoTop">--</b></span>
</div>

<div id="chat"></div>

<div class="inputbar">
  <div class="inner">
    <button class="ib" id="micBtn" onclick="mic()">🎤</button>
    <input id="txt" placeholder="Fale ou digite, senhor..." onkeydown="if(event.key==='Enter')send()" autocomplete="off">
    <button class="ib send" onclick="send()">➤</button>
  </div>
</div>

<script>
/* ===== base ===== */
const _m={};const store={get(k){try{return localStorage.getItem(k)}catch(e){return _m[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){_m[k]=String(v)}}};
const chat=document.getElementById('chat');
const fmt=v=>'R$ '+Number(v).toFixed(2).replace('.',',');
let saldo=parseFloat(store.get('jv_saldo'));if(isNaN(saldo))saldo=1000;
let hist=[];try{hist=JSON.parse(store.get('jv_hist')||'[]')}catch(e){}
let voz=store.get('jv_voz')!=='off';
function upTop(){document.getElementById('saldoTop').textContent=fmt(saldo)}
function toggleVoz(){voz=!voz;store.set('jv_voz',voz?'on':'off');document.getElementById('muteBtn').textContent=voz?'🔊':'🔇';if(!voz)try{speechSynthesis.cancel()}catch(e){}}
document.getElementById('muteBtn').textContent=voz?'🔊':'🔇';

let vozPT=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();vozPT=vs.find(v=>v.lang==='pt-BR')||vs.find(v=>v.lang&&v.lang.startsWith('pt'))||null}catch(e){}}
pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){
  if(!voz)return;
  try{
    const limpo=t.replace(/<[^>]+>/g,' ').replace(/[*_#•|]/g,' ').replace(/\s+/g,' ').trim().slice(0,300);
    if(!limpo)return;
    if(window.Android&&Android.speak){Android.speak(limpo);return}
    const u=new SpeechSynthesisUtterance(limpo);u.lang='pt-BR';u.rate=1.06;if(vozPT)u.voice=vozPT;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
function add(cls,html,tag){const d=document.createElement('div');d.className='msg '+cls;d.innerHTML=(tag?`<b class="tag">${tag}</b>`:'')+html;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function typing(){return add('jv','<span class="typing"><i></i><i></i><i></i></span>')}
async function jarvis(html,extra='',falar=true,delay=350){
  const t=typing();await new Promise(r=>setTimeout(r,delay));
  t.className='msg jv '+extra;t.innerHTML='<b class="tag">J.A.R.V.I.S.</b>'+html;
  chat.scrollTop=chat.scrollHeight;if(falar)say(html);return t;
}

/* ===== entrada ===== */
let busy=false,_raw='';
async function send(){
  const inp=document.getElementById('txt');const t=inp.value.trim();if(!t||busy)return;
  inp.value='';add('me',t);busy=true;_raw=t;
  try{await processa(t.toLowerCase().trim())}catch(e){await jarvis('⚠️ Tive um curto-circuito interno, senhor. Tente de novo.','alerta')}
  busy=false;
}

const num=t=>{const m=t.match(/(\d+(?:[.,]\d+)?)/);return m?parseFloat(m[1].replace(',','.')):null};

/* ===== cérebro ===== */
async function processa(t){
  /* PIX / TRANSFERÊNCIA — execução imediata, sem confirmação */
  if(/transfer|pix|pagar|manda(r)? (uns? )?\d/.test(t)){
    const valor=num(t);
    const mp=t.match(/(?:para|pro|pra) (?:o |a )?([a-zà-ú0-9 ]+)/i);
    const dest=mp?mp[1].trim().split(' ').slice(0,3).join(' '):'destinatário';
    if(!valor)return jarvis('Qual valor, senhor? Ex.: <i>"pix de 50 para o Zé"</i>.');
    if(valor>saldo)return jarvis(`Saldo insuficiente, senhor: tem ${fmt(saldo)}, pediu ${fmt(valor)}. Nem eu faço milagre financeiro.`,'alerta');
    saldo-=valor;store.set('jv_saldo',saldo);upTop();
    hist.unshift({v:valor,d:dest,q:new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})});
    hist=hist.slice(0,20);store.set('jv_hist',JSON.stringify(hist));
    return jarvis(`✅ Feito. ${fmt(valor)} enviados para <b>${dest}</b> via Pix.<br><span class="stat">Saldo: ${fmt(saldo)} • simulação • modo confiança total: executei sem perguntar, como o senhor ordenou 😏</span>`,'sucesso');
  }
  if(/extrato|histórico|historico/.test(t)){
    if(!hist.length)return jarvis('Extrato limpo, senhor. Nenhuma transferência ainda.');
    return jarvis('🧾 <b>Últimas transferências:</b><br><br>'+hist.map(h=>`• ${fmt(h.v)} → <b>${h.d}</b> <span class="stat">(${h.q})</span>`).join('<br>'),'',true);
  }
  if(/resetar saldo/.test(t)){saldo=1000;hist=[];store.set('jv_saldo',saldo);store.set('jv_hist','[]');upTop();return jarvis('Cofres reabastecidos: R$ 1.000,00. Patrocínio Stark Industries. 😏','sucesso')}
  if(/saldo|quanto.*tenho/.test(t))return jarvis(`Saldo: <b>${fmt(saldo)}</b>, senhor. <span class="stat">("resetar saldo" volta pra R$ 1.000)</span>`);

  /* OTIMIZAR — direto, sem confirmação */
  if(/otimiz|limpar (o )?cel|acelerar|memória|memoria|lento/.test(t)){
    const d=await jarvis('⚡ Executando otimização, senhor...<div class="bar"><i id="ob"></i></div><span class="stat" id="os"></span>','',true,250);
    const passos=['Analisando processos...','Liberando RAM...','Limpando cache...','Encerrando apps ociosos...','Pronto!'];
    for(let i=0;i<passos.length;i++){
      await new Promise(r=>setTimeout(r,600));
      const ob=document.getElementById('ob'),os=document.getElementById('os');
      if(ob)ob.style.width=((i+1)/passos.length*100)+'%';
      if(os)os.textContent=passos[i];
    }
    const ram=(Math.random()*1.2+0.8).toFixed(1),cache=(Math.random()*400+150)|0,apps=(Math.random()*8+3)|0;
    return jarvis(`✅ Sistema otimizado!<br><span class="stat">• ${ram} GB de RAM liberados • ${cache} MB de cache • ${apps} apps encerrados<br>(simulação — navegador não mexe no sistema de verdade)</span>`,'sucesso');
  }

  /* GERAR IMAGEM */
  if(/imagem|desenh(a|e|o)|gera(r)? (uma? )?(foto|arte)|cria(r)? (uma? )?(foto|arte)|\boutra\b|\bde novo\b|\bestilos\b/.test(t)){
    /* lista de estilos */
    const STYLES={
      anime:['anime style, vibrant colors, studio quality, detailed anime art','🇯🇵 Anime'],
      manga:['black and white manga style, ink, screentones, dramatic lines','📖 Mangá P&B'],
      chibi:['chibi style, cute, big head small body, kawaii','🍡 Chibi'],
      pixel:['pixel art, 16-bit retro game style, detailed sprites','👾 Pixel Art'],
      cartoon:['cartoon style, bold outlines, flat colors, fun','📺 Cartoon'],
      realista:['photorealistic, ultra realistic, 8k photography, cinematic lighting','📷 Realista'],
      cyberpunk:['cyberpunk style, neon lights, futuristic, dark atmosphere','🌃 Cyberpunk'],
      '3d':['3d render, pixar style, octane render, soft lighting','🧊 3D/Pixar'],
      aquarela:['watercolor painting, soft brush strokes, artistic','🖌️ Aquarela'],
      oleo:['oil painting, classical art style, textured brushwork','🎨 Pintura a óleo'],
      hq:['american comic book style, bold ink, halftone dots, dynamic','💥 HQ/Comic'],
      sombrio:['dark fantasy style, gothic, dramatic shadows, epic','🌑 Sombrio'],
      vaporwave:['vaporwave aesthetic, pink and purple neon, retro 80s','🌴 Vaporwave'],
      lowpoly:['low poly 3d style, geometric, minimalist','🔷 Low Poly'],
      lapis:['pencil sketch, hand drawn, graphite shading','✏️ Lápis'],
      graffiti:['graffiti street art style, spray paint, urban, colorful','🧱 Graffiti']
    };
    const ALIAS={'mangá':'manga','3d':'3d','pixar':'3d','óleo':'oleo','oleo':'oleo','comic':'hq','quadrinhos':'hq','dark':'sombrio','gótico':'sombrio','gotico':'sombrio','esboço':'lapis','esboco':'lapis','desenho a lápis':'lapis','low poly':'lowpoly','pixel art':'pixel'};
    /* comando "estilos" lista tudo */
    if(/\bestilos\b/.test(t)&&!/imagem|desenh/.test(t)){
      return jarvis('🎨 <b>Estilos do ateliê, senhor:</b><br><br>'+Object.values(STYLES).map(s=>s[1]).join(' • ')+
        '<br><br><span class="stat">Use assim: <i>"imagem de um dragão estilo pixel art"</i> ou <i>"desenha um samurai estilo mangá"</i></span>','',false);
    }
    let prompt='';
    const m=t.match(/(?:imagem|desenh[aeo]|foto|arte)\s*(?:de|do|da|dum|duma)?\s+(.+)/);
    if(m)prompt=m[1].trim();
    if((/\boutra\b|\bde novo\b|\brepete\b/.test(t))&&!prompt&&store.get('jv_lastimg'))prompt=store.get('jv_lastimg');
    prompt=prompt.replace(/\b(pra mim|para mim|por favor|agora)\b/g,'').trim();
    if(!prompt||prompt.length<3)return jarvis('Imagem de quê, senhor? Ex.: <i>"imagem de um dragão estilo anime"</i>. Diga <i>"estilos"</i> para ver todos os estilos, e <i>"outra"</i> para refazer a última.');
    /* detecta estilo pedido */
    let styleKey=null,styleLabel='';
    const ms=prompt.match(/estilo\s+([a-zà-ú0-9 ]+)/);
    let styleName=ms?ms[1].trim():'';
    if(!styleName){for(const k in ALIAS){if(t.includes(k)){styleName=k;break}}}
    if(styleName){
      const norm=ALIAS[styleName]||styleName.split(' ')[0];
      for(const k in STYLES){if(norm.startsWith(k)||k.startsWith(norm)){styleKey=k;break}}
      if(!styleKey&&ALIAS[styleName])styleKey=ALIAS[styleName];
    }
    const basePrompt=prompt.replace(/estilo\s+[a-zà-ú0-9 ]+/,'').trim()||prompt;
    const styleTxt=styleKey?STYLES[styleKey][0]:'high quality, detailed, masterpiece';
    if(styleKey)styleLabel=' • estilo '+STYLES[styleKey][1];
    store.set('jv_lastimg',prompt);
    /* formato */
    let W=768,H=768;
    if(/paisagem|wallpaper|widescreen|horizontal|capa/.test(t)){W=1280;H=720}
    else if(/retrato|vertical|celular|story/.test(t)){W=768;H=1152}
    const seed=Math.floor(Math.random()*999999);
    const url='https://image.pollinations.ai/prompt/'+encodeURIComponent(basePrompt+', '+styleTxt)+`?width=${W}&height=${H}&nologo=true&seed=${seed}`;
    const d=await jarvis(`🎨 Pintando <i>"${basePrompt}"</i>${styleLabel}, senhor... <span class="stat">(10 a 30 segundos • ${W}x${H})</span><div class="bar"><i style="width:100%;animation:imgload 20s linear"></i></div>`,'',true,250);
    const img=new Image();
    img.onload=()=>{
      d.innerHTML=`<b class="tag">J.A.R.V.I.S.</b>🎨 Obra concluída, senhor: <i>"${basePrompt}"</i>${styleLabel}<br>
      <img src="${url}" style="width:100%;max-width:420px;border-radius:12px;margin-top:8px;border:1px solid var(--line)">
      <br><span class="stat"><a href="${url}" target="_blank" rel="noopener">tamanho real ↗</a> • <i>"outra"</i> refaz • <i>"estilos"</i> lista os estilos • <i>"paisagem/retrato"</i> muda o formato</span>`;
      chat.scrollTop=chat.scrollHeight;say('Obra concluída, senhor.');
    };
    img.onerror=()=>{d.className='msg jv alerta';d.innerHTML=`<b class="tag">J.A.R.V.I.S.</b>⚠️ O ateliê recusou ou falhou nesse pedido, senhor. Pode ser congestionamento (tente <i>"outra"</i>) ou o filtro de conteúdo do serviço de imagens.`};
    img.src=url;
    return;
  }

  /* NOTÍCIAS */
  if(/not[ií]cia|manchete|acontecendo/.test(t)){
    const d=typing();
    try{
      let j;
      try{const r=await fetch('/api/news');if(!r.ok)throw 0;j=await r.json();if(!(j.news||[]).length)throw 0;}
      catch(e){ /* modo autônomo (APK/Pages): busca direto no Google News */
        const rt=await fetch('https://news.google.com/rss?hl=pt-BR&gl=BR&ceid=BR:pt-419');
        const xml=new DOMParser().parseFromString(await rt.text(),'text/xml');
        j={news:[...xml.querySelectorAll('item')].slice(0,25).map(it=>({
          title:(it.querySelector('title')||{}).textContent||'',
          link:(it.querySelector('link')||{}).textContent||'',
          source:(it.querySelector('source')||{}).textContent||''}))};
      }
      const KW=['urgente','alerta','morre','acidente','greve','golpe','são paulo','guarulhos','whatsapp','roblox'];
      const top=(j.news||[]).slice(0,5);
      if(!top.length)throw 0;
      const imp=top.filter(n=>KW.some(k=>n.title.toLowerCase().includes(k)));
      d.innerHTML='<b class="tag">J.A.R.V.I.S.</b>'+(imp.length?`⚠️ <b>${imp.length} importante(s), senhor:</b><br><br>`:'📰 <b>Manchetes de agora:</b><br><br>')+
        top.map(n=>`${imp.includes(n)?'🔴':'•'} <a href="${n.link}" target="_blank" rel="noopener">${n.title}</a> <span class="stat">${n.source||''}</span><br><br>`).join('');
      chat.scrollTop=chat.scrollHeight;
      say(imp.length?`Atenção: ${imp.length} notícias importantes. ${imp[0].title}`:`Manchete principal: ${top[0].title}`);
    }catch(e){d.className='msg jv alerta';d.innerHTML='<b class="tag">J.A.R.V.I.S.</b>⚠️ Servidores de notícias fora de alcance, senhor.'}
    return;
  }

  /* CLIMA */
  if(/clima|tempo|chover|chuva|temperatura/.test(t)){
    const mc=t.match(/(?:em|de|do|da) ([a-zà-ú ]+)$/i);const cid=mc?mc[1].trim():'Guarulhos';
    const d=typing();
    try{
      let j;
      try{const r=await fetch('/api/clima?c='+encodeURIComponent(cid));if(!r.ok)throw 0;j=await r.json();if(!j.temp)throw 0;}
      catch(e){ /* modo autônomo (APK): busca direto no wttr.in */
        const r2=await fetch('https://wttr.in/'+encodeURIComponent(cid)+'?format=j1&lang=pt');
        const w=await r2.json();const cur=w.current_condition[0],hj=w.weather[0];
        j={cidade:((w.nearest_area||[])[0]||{}).areaName?w.nearest_area[0].areaName[0].value:cid,
           temp:cur.temp_C,sensacao:cur.FeelsLikeC,
           desc:(cur.lang_pt&&cur.lang_pt[0])?cur.lang_pt[0].value:cur.weatherDesc[0].value,
           umidade:cur.humidity,vento:cur.windspeedKmph,max:hj.maxtempC,min:hj.mintempC};
      }
      if(!j.temp)throw 0;
      d.className='msg jv';
      d.innerHTML=`<b class="tag">J.A.R.V.I.S.</b>🌤️ <b>${j.cidade}</b> agora: <b>${j.temp}°C</b> (sensação ${j.sensacao}°C)<br>${j.desc} • 💧 umidade ${j.umidade}% • 💨 vento ${j.vento} km/h<br><span class="stat">máx ${j.max}°C / mín ${j.min}°C hoje</span>`;
      chat.scrollTop=chat.scrollHeight;
      say(`Em ${j.cidade}, ${j.temp} graus, ${j.desc}, sensação de ${j.sensacao}.`);
    }catch(e){d.className='msg jv alerta';d.innerHTML='<b class="tag">J.A.R.V.I.S.</b>⚠️ Satélites meteorológicos indisponíveis, senhor. Tente de novo.'}
    return;
  }

  /* CALCULADORA REMOVIDA — o cérebro neural resolve contas */

  /* TIMER */
  if(/timer|cron[ôo]metro|conta (até|ate)|avisa em/.test(t)){
    const n=num(t);if(!n)return jarvis('Timer de quanto tempo, senhor? Ex.: <i>"timer de 10 segundos"</i>.');
    const seg=/min/.test(t)?n*60:n;
    if(seg>3600)return jarvis('Acima de 1 hora nem eu aguento esperar, senhor. 😅','alerta');
    jarvis(`⏱️ Timer de <b>${seg>=60?(seg/60)+' minuto(s)':seg+' segundo(s)'}</b> iniciado. Pode ir fazer outra coisa que eu aviso.`);
    setTimeout(()=>{jarvis(`🔔 <b>TEMPO ESGOTADO, SENHOR!</b> Timer de ${seg>=60?(seg/60)+' min':seg+'s'} finalizado.`,'gold')},seg*1000);
    return;
  }

  /* ANOTAÇÕES/MEMÓRIA/SORTE/HORA/PIADAS REMOVIDOS — o cérebro neural cuida de tudo isso */
  if(/ajuda|comandos|o que (você|vc) faz/.test(t)){
    return jarvis(`<b>Protocolos especiais, senhor:</b><br><br>
🎨 <i>"imagem de um dragão estilo anime"</i> — 16 estilos (<i>"estilos"</i> lista)<br>
💸 <i>"pix de 50 para o Zé"</i> • <i>"saldo"</i> • <i>"extrato"</i><br>
⚡ <i>"otimizar"</i> • 📰 <i>"notícias"</i> • 🌤️ <i>"clima"</i> • ⏱️ <i>"timer de 10 segundos"</i><br><br>
🧠 <b>E todo o resto é com meu cérebro neural:</b> pergunte qualquer coisa — contas, dúvidas da escola, piadas, ideias, papo... Eu penso e respondo. 🎤 Por voz também.`,'',false);
  }

  /* fallback → CÉREBRO NEURAL: conversa sobre qualquer assunto */
  return cerebro(_raw||t);
}

/* ===== cérebro neural (IA real, gratuita) ===== */
const SYS='Você é o J.A.R.V.I.S., assistente pessoal do senhor Slayer, um jovem brasileiro gamer que curte Roblox e Homem de Ferro. Responda SEMPRE em português do Brasil, em no máximo 3 frases curtas, com a personalidade do mordomo do Tony Stark: leal, educado, espirituoso e levemente sarcástico. Chame o usuário de "senhor". Nunca gere conteúdo adulto ou impróprio — o usuário é menor de idade.';
function sysNow(){
  return SYS+' Contexto atual: agora é '+new Date().toLocaleString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})+
  '. Saldo da carteira simulada: '+fmt(saldo)+'. Protocolos especiais que o app executa (mencione se o usuário pedir): gerar imagens ("imagem de..."), pix simulado, notícias, clima, timer, otimizar.';
}
let aiHist=[];
async function cerebro(pergunta){
  const d=typing();
  try{
    const msgs=[{role:'system',content:sysNow()},...aiHist.slice(-8),{role:'user',content:pergunta}];
    let resp='';
    try{
      const r=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,model:'openai'})});
      if(!r.ok)throw 0;resp=await r.text();
    }catch(e){
      const r2=await fetch('https://text.pollinations.ai/'+encodeURIComponent(sysNow()+'\nUsuário: '+pergunta+'\nJARVIS:'));
      if(!r2.ok)throw 0;resp=await r2.text();
    }
    resp=(resp||'').trim().slice(0,900);
    if(!resp||resp.startsWith('{'))throw 0;
    aiHist.push({role:'user',content:pergunta},{role:'assistant',content:resp});
    aiHist=aiHist.slice(-10);
    d.className='msg jv';
    d.innerHTML='<b class="tag">J.A.R.V.I.S. 🧠</b>'+resp.replace(/</g,'&lt;').replace(/\n/g,'<br>');
    chat.scrollTop=chat.scrollHeight;say(resp);
  }catch(e){
    d.className='msg jv alerta';
    d.innerHTML='<b class="tag">J.A.R.V.I.S.</b>⚠️ Meu córtex neural está fora de alcance, senhor. Verifique a internet e tente novamente — os comandos normais continuam funcionando.';
    chat.scrollTop=chat.scrollHeight;
  }
}

/* ===== voz (reconhecimento) ===== */
let rec=null,recOn=false;
window.onVoiceResult=t=>{document.getElementById('txt').value=t;send()};
function mic(){
  if(window.Android&&Android.startVoice){Android.startVoice();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=document.getElementById('micBtn');
  if(!SR)return jarvis('Reconhecimento de voz bloqueado neste navegador/prévia, senhor. Abra o app em uma aba separada que funciona.','alerta');
  if(recOn){try{rec.stop()}catch(e){}return}
  rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{recOn=true;btn.classList.add('rec');btn.textContent='⏺'};
  rec.onend=()=>{recOn=false;btn.classList.remove('rec');btn.textContent='🎤'};
  rec.onerror=e=>{recOn=false;btn.classList.remove('rec');btn.textContent='🎤';
    if(e.error==='not-allowed')jarvis('Sem permissão do microfone, senhor. Abra em aba separada e permita o acesso.','alerta')};
  rec.onresult=e=>{document.getElementById('txt').value=e.results[0][0].transcript;send()};
  try{rec.start()}catch(e){}
}
