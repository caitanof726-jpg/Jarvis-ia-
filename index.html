<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#030610">
<meta name="color-scheme" content="dark">
<title>J.A.R.V.I.S. v3.3 — Turbo</title>
<link rel="preconnect" href="https://image.pollinations.ai">
<link rel="preconnect" href="https://text.pollinations.ai">
<style>
  :root{--bg:#030610;--panel:#0a1120;--line:#13304d;--cy:#2fd8ff;--cy2:#0aa8d6;--gold:#ffb340;--red:#ff4455;--ok:#39e07a;--txt:#d8f3ff;--mut:#5d8aa8}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:radial-gradient(900px 500px at 50% -10%,rgba(47,216,255,.12),transparent),var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
  header{text-align:center;padding:14px 10px 4px;position:relative}
  .reactor{width:70px;height:70px;margin:0 auto 6px;border-radius:50%;position:relative;
    background:radial-gradient(circle,#eafcff 0%,#9feaff 18%,#2fd8ff 38%,#07314d 70%,transparent 72%);
    box-shadow:0 0 30px rgba(47,216,255,.75);animation:pulse 3s ease-in-out infinite;will-change:transform,opacity}
  .reactor::before,.reactor::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(47,216,255,.6);will-change:transform}
  .reactor::before{animation:spin 9s linear infinite}
  .reactor::after{inset:8px;border-style:solid;border-color:rgba(255,255,255,.35);animation:spin 5s linear infinite reverse}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.88}}
  h1{font-size:1.3rem;letter-spacing:6px;color:var(--cy);text-shadow:0 0 18px rgba(47,216,255,.7)}
  .tagline{color:var(--mut);font-size:.72rem;letter-spacing:2px;margin-top:2px}
  #muteBtn{position:absolute;right:14px;top:14px;background:var(--panel);border:1px solid var(--line);color:var(--cy);
    width:42px;height:42px;border-radius:12px;font-size:1.1rem;cursor:pointer}
  .status{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:8px;font-size:.72rem;color:var(--mut);letter-spacing:1px}
  .status b{color:var(--ok)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:inline-block;animation:blink 2s infinite;margin-right:4px}
  @keyframes blink{50%{opacity:.4}}
  #chat{flex:1;overflow-y:auto;max-width:760px;width:100%;margin:0 auto;padding:10px 14px 16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:86%;padding:11px 15px;border-radius:14px;font-size:.95rem;line-height:1.5;animation:pop .2s;word-wrap:break-word}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .me{align-self:flex-end;background:linear-gradient(135deg,#123a5c,#0d2a44);border:1px solid var(--line);border-bottom-right-radius:4px}
  .jv{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--cy);border-bottom-left-radius:4px}
  .jv b.tag{color:var(--cy);font-size:.68rem;letter-spacing:2px;display:block;margin-bottom:4px}
  .jv.alerta{border-left-color:var(--red)}
  .jv.sucesso{border-left-color:var(--ok)}
  .jv.gold{border-left-color:var(--gold)}
  .jv a{color:var(--cy)}
  .bar{height:10px;background:#07233b;border-radius:6px;overflow:hidden;margin:8px 0 3px}
  .bar i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,var(--cy2),var(--cy));transition:transform .25s ease-out}
  .bar i.load{animation:imgload 8s ease-out both}
  @keyframes imgload{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .obra{display:block;width:100%;max-width:420px;height:auto;border-radius:12px;margin-top:8px;border:1px solid var(--line);background:#07233b;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
  .obra.ready{opacity:1;transform:none}
  .stat{font-size:.8rem;color:var(--mut)}
  .typing{display:inline-flex;gap:4px;padding:4px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--cy);animation:tp 1s infinite;will-change:transform,opacity}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes tp{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}
  .inputbar{position:sticky;bottom:0;background:rgba(3,6,16,.98);border-top:1px solid var(--line);padding:10px 12px 12px}
  .inner{max-width:760px;margin:0 auto;display:flex;gap:8px}
  #txt{flex:1;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:1rem;outline:none}
  #txt:focus{border-color:var(--cy);box-shadow:0 0 14px rgba(47,216,255,.25)}
  .ib{width:50px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--cy);font-size:1.25rem;cursor:pointer;flex-shrink:0}
  .ib.send{background:linear-gradient(135deg,var(--cy2),var(--cy));color:#032}
  .ib.rec{background:var(--red);color:#fff;border-color:var(--red);animation:blink 1s infinite}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    .obra{opacity:1;transform:none}
  }
</style>
</head>
<body>

<header>
  <button id="muteBtn" type="button" onclick="toggleVoz()" title="Ativar/desativar voz" aria-label="Ativar ou desativar voz">🔊</button>
  <div class="reactor" aria-hidden="true"></div>
  <h1>J.A.R.V.I.S.</h1>
  <div class="tagline">v3.3 • MODO TURBO • RESPOSTAS LOCAIS</div>
</header>

<div class="status">
  <span><i class="dot"></i>ONLINE</span>
  <span>🕐 <b id="clock">--:--</b></span>
  <span>🔋 <b id="batt">--</b></span>
  <span>💰 <b id="saldoTop">--</b></span>
</div>

<div id="chat" role="log" aria-live="polite" aria-label="Conversa com J.A.R.V.I.S."></div>

<div class="inputbar">
  <div class="inner">
    <button class="ib" id="micBtn" type="button" onclick="mic()" aria-label="Falar por voz">🎤</button>
    <input id="txt" placeholder="Fale ou digite, senhor..." onkeydown="if(event.key==='Enter')send()" autocomplete="off" spellcheck="false">
    <button class="ib send" type="button" onclick="send()" aria-label="Enviar">➤</button>
  </div>
</div>

<script>
/* ===== base ===== */
const $=id=>document.getElementById(id);
const _m={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return _m[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){_m[k]=String(v)}}};
const chat=$('chat');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{try{const x=new URL(u,location.href);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}};
const fmt=v=>'R$ '+Number(v).toFixed(2).replace('.',',');
let saldo=parseFloat(store.get('jv_saldo'));if(isNaN(saldo))saldo=1000;
let hist=[];try{hist=JSON.parse(store.get('jv_hist')||'[]');if(!Array.isArray(hist))hist=[]}catch(e){hist=[]}
let voz=store.get('jv_voz')!=='off';
function upTop(){$('saldoTop').textContent=fmt(saldo)}
function toggleVoz(){voz=!voz;store.set('jv_voz',voz?'on':'off');$('muteBtn').textContent=voz?'🔊':'🔇';if(!voz)try{speechSynthesis.cancel()}catch(e){}}
$('muteBtn').textContent=voz?'🔊':'🔇';

let vozPT=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();vozPT=vs.find(v=>v.lang==='pt-BR')||vs.find(v=>v.lang&&v.lang.startsWith('pt'))||null}catch(e){}}
pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){
  if(!voz)return;
  try{
    const limpo=t.replace(/<[^>]+>/g,' ').replace(/[*_#•|]/g,' ').replace(/\s+/g,' ').trim().slice(0,260);
    if(!limpo)return;
    if(window.Android&&Android.speak){Android.speak(limpo);return}
    const u=new SpeechSynthesisUtterance(limpo);u.lang='pt-BR';u.rate=1.08;if(vozPT)u.voice=vozPT;
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){}
}
function add(cls,html,tag){
  const d=document.createElement('div');d.className='msg '+cls;
  d.innerHTML=(tag?`<b class="tag">${esc(tag)}</b>`:'')+html;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
}
function typing(){return add('jv','<span class="typing"><i></i><i></i><i></i></span>')}
async function jarvis(html,extra='',falar=true,delay=60){
  const t=typing();
  if(delay)await new Promise(r=>setTimeout(r,delay));
  t.className='msg jv '+extra;t.innerHTML='<b class="tag">J.A.R.V.I.S.</b>'+html;
  chat.scrollTop=chat.scrollHeight;if(falar)say(html);return t;
}

/* ===== rede: pega o primeiro que responder, aborta o resto ===== */
async function firstOk(jobs,ok,ms=6000){
  const ctrls=jobs.map(()=>new AbortController());
  const timers=ctrls.map(c=>setTimeout(()=>c.abort(),ms));
  try{
    return await Promise.any(jobs.map((job,i)=>job(ctrls[i].signal).then(v=>{
      if(!ok(v))throw new Error('resposta inválida');
      return v;
    })));
  }finally{timers.forEach(clearTimeout);ctrls.forEach(c=>c.abort())}
}

/* ===== entrada ===== */
let busy=false,_raw='';
async function send(){
  const inp=$('txt');const t=inp.value.trim();if(!t||busy)return;
  inp.value='';add('me',esc(t));busy=true;_raw=t;
  try{await processa(t.toLowerCase().trim())}catch(e){await jarvis('⚠️ Tive um curto-circuito interno, senhor. Tente de novo.','alerta')}
  busy=false;
}
const num=t=>{const m=t.match(/(\d+(?:[.,]\d+)?)/);return m?parseFloat(m[1].replace(',','.')):null};

/* ===== tabelas locais (criadas uma vez só) ===== */
const STYLES={
  anime:['anime style, vibrant colors, studio quality, detailed anime art','🇯🇵 Anime'],
  manga:['black and white manga style, ink, screentones, dramatic lines','📖 Mangá P&B'],
  chibi:['chibi style, cute, big head small body, kawaii','🍡 Chibi'],
  pixel:['pixel art, 16-bit retro game style, detailed sprites','👾 Pixel Art'],
  cartoon:['cartoon style, bold outlines, flat colors, fun','📺 Cartoon'],
  realista:['photorealistic, ultra realistic, 8k photography, cinematic lighting','📷 Realista'],
  cyberpunk:['cyberpunk style, neon lights, futuristic, dark atmosphere','🌃 Cyberpunk'],
  '3d':['3d render, pixar style, octane render, soft lighting','🧊 3D/Pixar'],
  aquarela:['watercolor painting, soft brush strokes, artistic','🖌️ Aquarela'],
  oleo:['oil painting, classical art style, textured brushwork','🎨 Pintura a óleo'],
  hq:['american comic book style, bold ink, halftone dots, dynamic','💥 HQ/Comic'],
  sombrio:['dark fantasy style, gothic, dramatic shadows, epic','🌑 Sombrio'],
  vaporwave:['vaporwave aesthetic, pink and purple neon, retro 80s','🌴 Vaporwave'],
  lowpoly:['low poly 3d style, geometric, minimalist','🔷 Low Poly'],
  lapis:['pencil sketch, hand drawn, graphite shading','✏️ Lápis'],
  graffiti:['graffiti street art style, spray paint, urban, colorful','🧱 Graffiti']
};
const STYLE_KEYS=Object.keys(STYLES);
const ALIAS={'mangá':'manga','3d':'3d','pixar':'3d','óleo':'oleo','oleo':'oleo','comic':'hq','quadrinhos':'hq','dark':'sombrio','gótico':'sombrio','gotico':'sombrio','esboço':'lapis','esboco':'lapis','desenho a lápis':'lapis','low poly':'lowpoly','pixel art':'pixel'};
const APPS={
  youtube:['YouTube','https://www.youtube.com'],whatsapp:['WhatsApp','https://web.whatsapp.com'],
  drive:['Google Drive','https://drive.google.com'],maps:['Google Maps','https://www.google.com/maps'],
  google:['Google','https://www.google.com'],gmail:['Gmail','https://mail.google.com'],
  spotify:['Spotify','https://open.spotify.com'],instagram:['Instagram','https://www.instagram.com'],
  github:['GitHub','https://github.com'],roblox:['Roblox','https://www.roblox.com'],
  netflix:['Netflix','https://www.netflix.com'],chatgpt:['ChatGPT','https://chatgpt.com']
};
const PIADAS=[
  'Por que o Roblox não vai ao banco? Porque já tem muitos blox. 😏',
  'Senhor, tentei otimizar o café, mas ele continua instantâneo. Não há mais o que acelerar. ☕',
  'O Homem de Ferro não usa debbuger… ele usa o reator arc e confia. 🦾',
  'Piada de programador: existem 10 tipos de pessoas — as que entendem binário e as que não. 💡',
  'Disse ao Wi-Fi que ele estava lento. Ele respondeu: «culpa do senhor, que abriu 42 abas». 📶'
];
const KW=['urgente','alerta','morre','acidente','greve','golpe','são paulo','guarulhos','whatsapp','roblox'];

/* ===== calculadora local, sem eval direto de texto livre ===== */
function calc(expr){
  const s=String(expr).slice(0,80).replace(/,/g,'.').replace(/[xX×]/g,'*').replace(/÷/g,'/')
    .replace(/\^/g,'**').replace(/[^\d.+\-*/()\s]/g,'').trim();
  if(!/\d/.test(s)||!/[+*\/%\-]/.test(s))return null;
  try{const v=Function('"use strict";return ('+s+')')();return typeof v==='number'&&Number.isFinite(v)?v:null}catch(e){return null}
}
const brNum=n=>Number(n.toFixed(6)).toLocaleString('pt-BR',{maximumFractionDigits:6});

/* ===== cérebro ===== */
async function processa(t){
  /* PIX / TRANSFERÊNCIA — simulação local, imediata */
  if(/\b(?:transfer\w*|pix|pagar)\b|\bmanda(r)? (uns? )?\d/.test(t)){
    const valor=num(t);
    const mp=t.match(/(?:para|pro|pra) (?:o |a )?([a-zà-ú0-9 ]+)/i);
    const dest=mp?mp[1].trim().split(' ').slice(0,3).join(' '):'destinatário';
    if(!valor)return jarvis('Qual valor, senhor? Ex.: <i>"pix de 50 para o Zé"</i>.');
    if(valor>saldo)return jarvis(`Saldo insuficiente, senhor: tem ${fmt(saldo)}, pediu ${fmt(valor)}. Nem eu faço milagre financeiro.`,'alerta');
    saldo-=valor;store.set('jv_saldo',saldo);upTop();
    hist.unshift({v:valor,d:dest,q:new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})});
    hist=hist.slice(0,20);store.set('jv_hist',JSON.stringify(hist));
    return jarvis(`✅ Feito. ${fmt(valor)} enviados para <b>${esc(dest)}</b> via Pix.<br><span class="stat">Saldo: ${fmt(saldo)} • simulação • modo confiança total: executei sem perguntar, como o senhor ordenou 😏</span>`,'sucesso');
  }
  if(/extrato|histórico|historico/.test(t)){
    if(!hist.length)return jarvis('Extrato limpo, senhor. Nenhuma transferência ainda.');
    return jarvis('🧾 <b>Últimas transferências:</b><br><br>'+hist.map(h=>`• ${fmt(h.v)} → <b>${esc(h.d)}</b> <span class="stat">(${esc(h.q)})</span>`).join('<br>'),'',true);
  }
  if(/resetar saldo/.test(t)){saldo=1000;hist=[];store.set('jv_saldo',saldo);store.set('jv_hist','[]');upTop();return jarvis('Cofres reabastecidos: R$ 1.000,00. Patrocínio Stark Industries. 😏','sucesso')}
  if(/saldo|quanto.*tenho/.test(t))return jarvis(`Saldo: <b>${fmt(saldo)}</b>, senhor. <span class="stat">("resetar saldo" volta pra R$ 1.000)</span>`);

  /* OTIMIZAR — simulação curta, sem 3 segundos de espera */
  if(/otimiz|limpar (o )?cel|acelerar|memória|memoria|lento/.test(t)){
    const d=await jarvis('⚡ Executando otimização, senhor...<div class="bar"><i id="ob"></i></div><span class="stat" id="os"></span>','',true,0);
    const passos=['Analisando processos...','Liberando RAM...','Limpando cache...','Encerrando apps ociosos...','Pronto!'];
    for(let i=0;i<passos.length;i++){
      await new Promise(r=>setTimeout(r,110));
      const ob=$('ob'),os=$('os');
      if(ob)ob.style.transform='scaleX('+((i+1)/passos.length)+')';
      if(os)os.textContent=passos[i];
    }
    const ram=(Math.random()*1.2+0.8).toFixed(1),cache=(Math.random()*400+150)|0,apps=(Math.random()*8+3)|0;
    return jarvis(`✅ Sistema otimizado!<br><span class="stat">• ${ram} GB de RAM liberados • ${cache} MB de cache • ${apps} apps encerrados<br>(simulação — navegador não mexe no sistema de verdade)</span>`,'sucesso');
  }

  /* GERAR IMAGEM — turbo por padrão, um único <img>, fallback para flux */
  if(/imagem|desenh(a|e|o)|gera(r)? (uma? )?(foto|arte)|cria(r)? (uma? )?(foto|arte)|\boutra\b|\bde novo\b|\bestilos\b/.test(t)){
    if(/\bestilos\b/.test(t)&&!/imagem|desenh/.test(t)){
      return jarvis('🎨 <b>Estilos do ateliê, senhor:</b><br><br>'+STYLE_KEYS.map(k=>STYLES[k][1]).join(' • ')+
        '<br><br><span class="stat">Use assim: <i>"imagem de um dragão estilo pixel art"</i>. <i>"HD"</i> troca qualidade por velocidade.</span>','',false);
    }
    const repeat=/\b(outra|de novo|repete)\b/i.test(t);
    const qualidade=/\b(hd|qualidade|alta resolu[cç][aã]o|detalhad[ao])\b/i.test(t);
    let last=null;try{last=JSON.parse(store.get('jv_lastimg')||'null')}catch(e){last=store.get('jv_lastimg')}
    let basePrompt='',styleKey=null,W=qualidade?768:512,H=qualidade?768:512;
    if(repeat&&last){
      if(typeof last==='string')basePrompt=last;
      else{basePrompt=last.p||'';styleKey=last.s||null;W=last.W||W;H=last.H||H}
    }else{
      let prompt=(t.match(/(?:imagem|desenh[aeo]|foto|arte)\s*(?:de|do|da|dum|duma)?\s+(.+)/)||[])[1]||'';
      prompt=prompt.replace(/\b(pra mim|para mim|por favor|agora)\b/gi,'')
        .replace(/\b(hd|qualidade|alta resolu[cç][aã]o|detalhad[ao]|r[aá]pido|turbo)\b/gi,'')
        .replace(/\b(paisagem|wallpaper|widescreen|horizontal|capa|retrato|vertical|celular|story)\b/gi,'')
        .replace(/^\s*(de|do|da|dum|duma)\s+/i,'').trim();
      if(!prompt||prompt.length<3)return jarvis('Imagem de quê, senhor? Ex.: <i>"imagem de um dragão estilo anime"</i>. Diga <i>"estilos"</i> para ver todos e <i>"outra"</i> para refazer.');
      const ms=prompt.match(/estilo\s+([a-zà-ú0-9 ]+)/);
      let styleName=ms?ms[1].trim():'';
      if(!styleName){for(const k in ALIAS){if(t.includes(k)){styleName=k;break}}}
      if(styleName){
        const norm=ALIAS[styleName]||styleName.split(' ')[0];
        for(const k of STYLE_KEYS){if(norm.startsWith(k)||k.startsWith(norm)){styleKey=k;break}}
        if(!styleKey&&ALIAS[styleName])styleKey=ALIAS[styleName];
      }
      basePrompt=prompt.replace(/estilo\s+[a-zà-ú0-9 ]+/,'').trim()||prompt;
      if(/paisagem|wallpaper|widescreen|horizontal|capa/.test(t)){W=qualidade?1280:768;H=qualidade?720:432}
      else if(/retrato|vertical|celular|story/.test(t)){W=qualidade?768:512;H=qualidade?1152:768}
    }
    if(!basePrompt||basePrompt.length<3)return jarvis('Não guardei a última imagem, senhor. Peça uma nova: <i>"imagem de um dragão"</i>.');
    if(styleKey&&!STYLES[styleKey])styleKey=null;
    const useHD=repeat&&last&&typeof last==='object'?!!last.q:qualidade;
    const styleTxt=styleKey?STYLES[styleKey][0]:'high quality, detailed, masterpiece';
    const styleLabel=styleKey?' • estilo '+STYLES[styleKey][1]:'';
    const model=useHD?'flux':'turbo';
    const seed=Math.floor(Math.random()*999999);
    const url='https://image.pollinations.ai/prompt/'+encodeURIComponent(basePrompt+', '+styleTxt)+
      `?width=${W}&height=${H}&nologo=true&enhance=false&safe=true&model=${model}&seed=${seed}`;
    store.set('jv_lastimg',JSON.stringify({p:basePrompt,s:styleKey,W,H,q:useHD}));
    const d=add('jv',`<b class="tag">J.A.R.V.I.S.</b><span class="headline">🎨 Pintando <i>"${esc(basePrompt)}"</i>${esc(styleLabel)}, senhor...</span> <span class="stat">(${useHD?'HD':'turbo'} • ${W}×${H})</span><div class="bar"><i class="load"></i></div><img class="obra" alt="${esc(basePrompt)}" width="${W}" height="${H}" fetchpriority="high" decoding="async">`);
    const img=d.querySelector('.obra');
    let loaded=false,tries=0,timer;
    const finish=()=>{
      if(loaded)return;loaded=true;clearTimeout(timer);
      img.classList.add('ready');
      const bar=d.querySelector('.bar');if(bar)bar.remove();
      const head=d.querySelector('.headline');if(head)head.innerHTML=`🎨 Obra concluída, senhor: <i>"${esc(basePrompt)}"</i>${esc(styleLabel)}`;
      const st=d.querySelector('.stat');if(st)st.innerHTML=`<a href="${esc(img.src)}" target="_blank" rel="noopener noreferrer">tamanho real ↗</a> • <i>"outra"</i> refaz • <i>"estilos"</i> lista`;
      chat.scrollTop=chat.scrollHeight;say('Obra concluída, senhor.');
    };
    const fail=()=>{
      if(loaded)return;clearTimeout(timer);
      if(tries===0&&model==='turbo'){
        tries++;
        const st=d.querySelector('.stat');if(st)st.textContent='Turbo ocupado, tentando Flux...';
        img.src=url.replace('model=turbo','model=flux');
        timer=setTimeout(fail,15000);
        return;
      }
      loaded=true;d.className='msg jv alerta';
      d.innerHTML='<b class="tag">J.A.R.V.I.S.</b>⚠️ O ateliê não respondeu a tempo, senhor. Tente <i>"outra"</i> ou peça com <i>"HD"</i>.';
      chat.scrollTop=chat.scrollHeight;
    };
    img.onload=finish;img.onerror=fail;
    timer=setTimeout(fail,9000);
    img.src=url;
    if(img.complete&&img.naturalWidth)finish();
    return;
  }

  /* NOTÍCIAS — servidor local e fonte direta correm em paralelo */
  if(/not[ií]cia|manchete|acontecendo/.test(t)){
    const d=typing();
    try{
      const local=async signal=>{
        const r=await fetch('/api/news',{signal,cache:'no-store'});if(!r.ok)throw 0;
        const j=await r.json();if(!(j.news||[]).length)throw 0;return j.news;
      };
      const direct=async signal=>{
        const r=await fetch('https://news.google.com/rss?hl=pt-BR&gl=BR&ceid=BR:pt-419',{signal});if(!r.ok)throw 0;
        const xml=new DOMParser().parseFromString(await r.text(),'text/xml');
        return [...xml.querySelectorAll('item')].slice(0,25).map(it=>({
          title:(it.querySelector('title')||{}).textContent||'',
          link:(it.querySelector('link')||{}).textContent||'',
          source:(it.getElementsByTagName('source')[0]||{}).textContent||''
        }));
      };
      const news=await firstOk([local,direct],a=>Array.isArray(a)&&a.length>0,6000);
      const top=news.slice(0,5);
      const imp=top.filter(n=>KW.some(k=>String(n.title).toLowerCase().includes(k)));
      d.className='msg jv';
      d.innerHTML='<b class="tag">J.A.R.V.I.S.</b>'+(imp.length?`⚠️ <b>${imp.length} importante(s), senhor:</b><br><br>`:'📰 <b>Manchetes de agora:</b><br><br>')+
        top.map(n=>`${imp.includes(n)?'🔴':'•'} <a href="${esc(safeUrl(n.link))}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a> <span class="stat">${esc(n.source||'')}</span><br><br>`).join('');
      chat.scrollTop=chat.scrollHeight;
      say(imp.length?`Atenção: ${imp.length} notícias importantes. ${imp[0].title}`:`Manchete principal: ${top[0].title}`);
    }catch(e){d.className='msg jv alerta';d.innerHTML='<b class="tag">J.A.R.V.I.S.</b>⚠️ Servidores de notícias fora de alcance, senhor.'}
    return;
  }

  /* CLIMA — mesma corrida, com timeout curto */
  if(/clima|tempo|chover|chuva|temperatura/.test(t)){
    const mc=t.match(/(?:em|de|do|da) ([a-zà-ú ]+)$/i);const cid=mc?mc[1].trim():'Guarulhos';
    const d=typing();
    try{
      const local=async signal=>{
        const r=await fetch('/api/clima?c='+encodeURIComponent(cid),{signal});if(!r.ok)throw 0;
        const j=await r.json();if(!j.temp)throw 0;return j;
      };
      const direct=async signal=>{
        const r=await fetch('https://wttr.in/'+encodeURIComponent(cid)+'?format=j1&lang=pt',{signal});if(!r.ok)throw 0;
        const w=await r.json(),cur=(w.current_condition||[{}])[0],hj=(w.weather||[{}])[0];
        const lp=cur.lang_pt||[],wd=cur.weatherDesc||[{}];
        return {cidade:(((w.nearest_area||[{}])[0].areaName||[{}])[0].value)||cid,
          temp:cur.temp_C,sensacao:cur.FeelsLikeC,
          desc:(lp[0]&&lp[0].value)||(wd[0]&&wd[0].value)||'',
          umidade:cur.humidity,vento:cur.windspeedKmph,max:hj.maxtempC,min:hj.mintempC};
      };
      const j=await firstOk([local,direct],x=>!!x.temp,6000);
      d.className='msg jv';
      d.innerHTML=`<b class="tag">J.A.R.V.I.S.</b>🌤️ <b>${esc(j.cidade)}</b> agora: <b>${esc(j.temp)}°C</b> (sensação ${esc(j.sensacao)}°C)<br>${esc(j.desc)} • 💧 umidade ${esc(j.umidade)}% • 💨 vento ${esc(j.vento)} km/h<br><span class="stat">máx ${esc(j.max)}°C / mín ${esc(j.min)}°C hoje</span>`;
      chat.scrollTop=chat.scrollHeight;
      say(`Em ${j.cidade}, ${j.temp} graus, ${j.desc}, sensação de ${j.sensacao}.`);
    }catch(e){d.className='msg jv alerta';d.innerHTML='<b class="tag">J.A.R.V.I.S.</b>⚠️ Satélites meteorológicos indisponíveis, senhor. Tente de novo.'}
    return;
  }

  /* TIMER */
  if(/timer|cron[ôo]metro|conta (até|ate)|avisa em/.test(t)){
    const n=num(t);if(!n)return jarvis('Timer de quanto tempo, senhor? Ex.: <i>"timer de 10 segundos"</i>.');
    const seg=/min/.test(t)?n*60:n;
    if(seg>3600)return jarvis('Acima de 1 hora nem eu aguento esperar, senhor. 😅','alerta');
    jarvis(`⏱️ Timer de <b>${seg>=60?(seg/60)+' minuto(s)':seg+' segundo(s)'}</b> iniciado. Pode ir fazer outra coisa que eu aviso.`);
    setTimeout(()=>{jarvis(`🔔 <b>TEMPO ESGOTADO, SENHOR!</b> Timer de ${seg>=60?(seg/60)+' min':seg+'s'} finalizado.`,'gold')},seg*1000);
    return;
  }

  /* AJUDA */
  if(/ajuda|comandos|o que (você|vc) faz/.test(t)){
    return jarvis(`<b>Protocolos, senhor:</b><br><br>
⚡ <b>Instantâneos (sem internet):</b> horas, data, bateria, piada, contas, atalhos de apps, saldo, pix, extrato, otimizar, timer<br>
🎨 <i>"imagem de um dragão estilo anime"</i> — 16 estilos, turbo por padrão (<i>"HD"</i> = mais qualidade)<br>
📰 <i>"notícias"</i> • 🌤️ <i>"clima"</i> • 🧠 qualquer outra pergunta vai ao cérebro neural<br><br>
<span class="stat">Diga <i>"estilos"</i> para a lista completa. 🎤 Também funciona por voz.</span>`,'',false);
  }

  /* RESPOSTAS LOCAIS — zero rede, zero espera de IA */
  if(/que horas|horas?|hora atual/.test(t)){
    return jarvis(`🕐 Agora são <b>${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</b>, senhor.`);
  }
  if(/que dia|data de hoje|dia de hoje|^\s*data\b|calend[aá]rio/.test(t)){
    return jarvis(`📅 Hoje é <b>${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</b>, senhor.`);
  }
  if(/bateria|n[ií]vel de bateria/.test(t)){
    await battP;
    return jarvis(battLevel===null?'🔋 Este navegador não me informa a bateria, senhor.':'🔋 Bateria em <b>'+battLevel+'%</b>, senhor.');
  }
  if(/piada|humor|zoar/.test(t)){
    return jarvis('😄 '+esc(PIADAS[Math.floor(Math.random()*PIADAS.length)]));
  }
  if(/^(oi|ol[aá]|e a[ií]|bom dia|boa tarde|boa noite|tudo bem|como vai|obrigad[oa]|valeu|quem (é|e) voc[eê]|seu nome)\b/.test(t)){
    const r=/obrigad|valeu/.test(t)?'Não foi nada, senhor. Estou aqui para isso.':
      /quem (é|e) voc|seu nome/.test(t)?'Sou J.A.R.V.I.S., seu assistente pessoal. Versão 3.3, modo turbo. 🦾':
      'Às suas ordens, senhor. Sistemas estáveis e esperando sua próxima instrução.';
    return jarvis(r);
  }
  const appKey=Object.keys(APPS).find(k=>new RegExp('\\b'+k+'\\b','i').test(t));
  if(appKey){
    const [label,url]=APPS[appKey];
    try{window.open(url,'_blank','noopener')}catch(e){}
    return jarvis(`🌐 Abrindo <b>${esc(label)}</b>, senhor. <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">abrir manualmente ↗</a>`,'sucesso',false);
  }
  const conta=calc(t);
  if(conta!==null)return jarvis(`🧮 <b>${brNum(conta)}</b>, senhor. Calculado localmente, sem acordar o córtex neural. 😏`);

  /* fallback → CÉREBRO NEURAL */
  return cerebro(_raw||t);
}

/* ===== cérebro neural (contexto enxuto + corrida com timeout) ===== */
const SYS='Você é o J.A.R.V.I.S., assistente do senhor Slayer, jovem brasileiro gamer que curte Roblox e Homem de Ferro. Responda SEMPRE em português do Brasil, em no máximo 3 frases curtas, com a personalidade do mordomo do Tony Stark: leal, educado, espirituoso e levemente sarcástico. Chame o usuário de "senhor". Nunca gere conteúdo adulto ou impróprio — o usuário é menor de idade.';
function sysNow(){
  return SYS+' Contexto: '+new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+
    '. Saldo simulado: '+fmt(saldo)+'. Comandos locais já resolvem horas, data, contas, piadas, apps, pix e imagens.';
}
let aiHist=[];
async function cerebro(pergunta){
  const d=typing();
  try{
    const msgs=[{role:'system',content:sysNow()},...aiHist.slice(-4),{role:'user',content:pergunta}];
    const post=async signal=>{
      const r=await fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:msgs,model:'openai',max_tokens:120,temperature:.8}),signal});
      if(!r.ok)throw 0;return (await r.text()).trim().slice(0,900);
    };
    const get=async signal=>{
      const r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(sysNow()+'\nUsuário: '+pergunta+'\nJARVIS:'),{signal});
      if(!r.ok)throw 0;return (await r.text()).trim().slice(0,900);
    };
    const resp=await firstOk([post,get],s=>s&&!s.startsWith('{'),10000);
    aiHist.push({role:'user',content:pergunta},{role:'assistant',content:resp});aiHist=aiHist.slice(-4);
    d.className='msg jv';
    d.innerHTML='<b class="tag">J.A.R.V.I.S. 🧠</b>'+esc(resp).replace(/\n/g,'<br>');
    chat.scrollTop=chat.scrollHeight;say(resp);
  }catch(e){
    d.className='msg jv alerta';
    d.innerHTML='<b class="tag">J.A.R.V.I.S.</b>⚠️ Meu córtex neural está fora de alcance, senhor. Os comandos locais continuam instantâneos.';
    chat.scrollTop=chat.scrollHeight;
  }
}

/* ===== voz (reconhecimento) ===== */
let rec=null,recOn=false;
window.onVoiceResult=t=>{$('txt').value=t;send()};
function mic(){
  if(window.Android&&Android.startVoice){Android.startVoice();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=$('micBtn');
  if(!SR)return jarvis('Reconhecimento de voz bloqueado neste navegador/prévia, senhor. Abra o app em uma aba separada que funciona.','alerta');
  if(recOn){try{rec.stop()}catch(e){}return}
  rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.maxAlternatives=1;
  rec.onstart=()=>{recOn=true;btn.classList.add('rec');btn.textContent='⏺'};
  rec.onend=()=>{recOn=false;btn.classList.remove('rec');btn.textContent='🎤'};
  rec.onerror=e=>{recOn=false;btn.classList.remove('rec');btn.textContent='🎤';
    if(e.error==='not-allowed')jarvis('Sem permissão do microfone, senhor. Abra em aba separada e permita o acesso.','alerta')};
  rec.onresult=e=>{$('txt').value=e.results[0][0].transcript;send()};
  try{rec.start()}catch(e){}
}

/* ===== status: relógio atualiza 1x por minuto, não 60x ===== */
function tick(){
  $('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  setTimeout(tick,60000-(Date.now()%60000)+50);
}
tick();
let battLevel=null;
const battP=navigator.getBattery?navigator.getBattery().then(b=>{
  const up=()=>{battLevel=Math.round(b.level*100);$('batt').textContent=battLevel+'%'};
  up();b.onlevelchange=up;return b;
}).catch(()=>null):Promise.resolve(null);
if(!navigator.getBattery)$('batt').textContent='n/d';
upTop();

/* ===== boot ===== */
setTimeout(()=>{jarvis('Sistemas <b>v3.3 turbo</b> online. Bem-vindo, <b>senhor Slayer</b>. 🦾<br><span class="stat">⚡ Horas, data, contas, piadas e apps respondem na hora. Imagens em modo turbo. Diga "ajuda" se precisar.</span>','',true,0)},80);
</script>
